<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Drive Accounts Manager (Drive-2.0)</title>

<!-- Google libs -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<style>
/* --- CSS (giữ nguyên phong cách từ code cũ) --- */
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.btn { padding:6px 10px; border-radius:6px; border:none; cursor:pointer; background:var(--btn-bg); color:var(--btn-text); font-weight:500; }
.btn:hover{opacity:0.95}
.btn.danger { background:#e74c3c; color:#fff; }
.select, .input { padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); }
.account-card { display:flex; align-items:flex-start; gap:12px; margin:8px 0; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--card-bg); color:var(--text); }
.account-card .left { width:56px; flex:0 0 56px; }
.account-card img { width:56px; height:56px; border-radius:50%; object-fit:cover; }
.account-card .main { flex:1; }
.account-card .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.muted { color:var(--muted); font-size:0.95em; }
.progress-bar { margin:6px 0; width:100%; height:12px; background:var(--progress-bg); border-radius:8px; overflow:hidden; position:relative; }
.progress-fill { height:100%; transition:width .4s ease; background: linear-gradient(90deg, var(--progress-color-start), var(--progress-color-end)); }
.summary-box { margin:6px 0 12px; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--summary-bg); color:var(--text); }
.card-toggle { background:transparent; border:none; cursor:pointer; font-size:14px; padding:4px; }
.collapsed .details { display:none; }

/* vars - light */
:root {
  --text:#222;
  --muted:#666;
  --border:#ddd;
  --card-bg:#fff;
  --summary-bg:#f6f6f6;
  --progress-bg:#eee;
  --btn-bg:#3498db;
  --btn-text:#fff;
  --progress-color-start:#2ecc71;
  --progress-color-end:#27ae60;
}

/* dark */
@media (prefers-color-scheme: dark) {
  :root {
    --text:#eaeaea;
    --muted:#bfbfbf;
    --border:#444;
    --card-bg:#1f1f1f;
    --summary-bg:#262626;
    --progress-bg:#333;
    --btn-bg:#2980b9;
    --btn-text:#fff;
    --progress-color-start:#16a085;
    --progress-color-end:#1abc9c;
  }
}

/* responsive */
@media (max-width:700px) {
  .controls { gap:6px; }
  .account-card { flex-direction:column; align-items:flex-start; }
  .account-card .left { width:48px; }
}
</style>
</head>
<body>

<!-- UI -->
<div id="driveApp">
  <div id="controls" class="controls">
    <select id="langSelect" class="select">
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="en">🇺🇸 English</option>
    </select>

    <button id="loginBtn" class="btn" data-i18n="addAccount"></button>
    <button id="refreshAllBtn" class="btn" data-i18n="refreshAll"></button>
    <button id="exportBtn" class="btn" data-i18n="export"></button>

    <input id="importFile" type="file" accept=".json" style="display:none"/>
    <button id="importBtn" class="btn" data-i18n="import"></button>

    <button id="clearAllBtn" class="btn danger" data-i18n="clearAll"></button>

    <select id="sortSelect" class="select">
      <option value="default" data-i18n="sortDefault"></option>
      <option value="used_desc" data-i18n="sortUsed"></option>
      <option value="remain_desc" data-i18n="sortRemain"></option>
      <option value="email_asc" data-i18n="sortEmail"></option>
    </select>

    <input id="filterInput" class="input" data-i18n-placeholder="search" />
  </div>

  <div id="summary"></div>
  <div id="driveAccounts"></div>
</div>

<script>
/* === i18n dictionary === */
const i18n = {
  vi: {
    addAccount: "+ Thêm tài khoản Google",
    refreshAll: "🔁 Làm mới token (All)",
    export: "⬇️ Xuất (không có token)",
    import: "⬆️ Nhập JSON",
    clearAll: "🗑 Xóa tất cả",
    sortDefault: "Sắp xếp: Mặc định",
    sortUsed: "Đã dùng (giảm dần)",
    sortRemain: "Còn lại (giảm dần)",
    sortEmail: "Email (A → Z)",
    search: "Tìm theo email hoặc tên",
    openDrive: "Truy cập Drive",
    login: "Login (cấp token)",
    refreshSilent: "Refresh (🔁)",
    delete: "Xóa",
    collapse: "Thu gọn ❖",
    totalSummary: "📊 Tổng dung lượng từ tất cả tài khoản",
    confirmClear: "Xác nhận xóa tất cả tài khoản khỏi localStorage?",
    confirmDelete: "Xóa {email} khỏi danh sách?",
    noAccounts: "Không có account nào",
    confirmRefreshAll: "Thử làm mới token cho tất cả tài khoản (im lặng). Nếu không thành công, sẽ yêu cầu login từng account). Tiếp tục?",
    tokenMissing: "Token chưa có hoặc hết hạn, cần Login để lấy token (button Login)",
    tokenAvailable: "Token đã có. Cập nhật lần cuối: {time}",
    alertExport: "Đã xuất JSON (không chứa token). Khi import, bạn cần re-login cho từng tài khoản.",
    alertImportResult: "Import xong: {newAcc} account mới, {updatedAcc} account cập nhật. Các account cần re-login để có token.",
    errorImport: "Lỗi khi đọc file: ",
    summaryTotal: "Tổng",
    summaryUsed: "Đã dùng",
    summaryRemain: "Còn lại"
  },
  en: {
    addAccount: "+ Add Google Account",
    refreshAll: "🔁 Refresh tokens (All)",
    export: "⬇️ Export (no token)",
    import: "⬆️ Import JSON",
    clearAll: "🗑 Clear all",
    sortDefault: "Sort: Default",
    sortUsed: "Used (desc)",
    sortRemain: "Remaining (desc)",
    sortEmail: "Email (A → Z)",
    search: "Search by email or name",
    openDrive: "Open Drive",
    login: "Login (grant token)",
    refreshSilent: "🔁 Refresh",
    delete: "Delete",
    collapse: "Collapse ❖",
    totalSummary: "📊 Total storage from all accounts",
    confirmClear: "Confirm clearing all accounts from localStorage?",
    confirmDelete: "Delete {email} from the list?",
    noAccounts: "No accounts found",
    confirmRefreshAll: "Try silent token refresh for all accounts? If not successful, interactive login will be required. Continue?",
    tokenMissing: "Token missing or expired, please Login to get token",
    tokenAvailable: "Token available. Last update: {time}",
    alertExport: "JSON exported (without tokens). On import, you must re-login each account.",
    alertImportResult: "Import complete: {newAcc} new accounts, {updatedAcc} updated. Accounts need re-login for token.",
    errorImport: "Error reading file: ",
    summaryTotal: "Total",
    summaryUsed: "Used",
    summaryRemain: "Remaining"
  }
};

let currentLang = localStorage.getItem("lang") || "vi";
function setLang(lang){
  currentLang = lang;
  localStorage.setItem("lang", lang);
  // update static UI texts
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    const key = el.getAttribute("data-i18n-placeholder");
    if(i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
  });
  const sel = document.getElementById("langSelect");
  if(sel) sel.value = lang;
}
function t(key, vars = {}){
  const dict = i18n[currentLang] || {};
  let str = dict[key] || key;
  for(const k in vars) str = str.replace(`{${k}}`, vars[k]);
  return str;
}
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("langSelect").addEventListener("change", (e) => {
    setLang(e.target.value);
    renderAccounts();
  });
  setLang(currentLang);
});

/* === Cấu hình API ===
   Thay CLIENT_ID / API_KEY nếu bạn dùng app riêng */
const CLIENT_ID = "38167051736-41cccg5vha31a26m2r01qrc3orq16q0l.apps.googleusercontent.com";
const API_KEY   = "AIzaSyA5qxkINvYg421h2jGmxN84L8RWYCBeCwU";
const SCOPES    = "https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/drive.readonly openid email profile";

/* === trạng thái === */
let accounts = []; // stored under key "drive_accounts"
let tokenClient = null;
let pendingEmailForToken = null;
let pendingTokenPromiseResolve = null;

/* === helpers === */
function genId(){ return Math.random().toString(36).slice(2,9); }
function saveAccounts(){ localStorage.setItem("drive_accounts", JSON.stringify(accounts)); }
function loadAccounts(){ const d = localStorage.getItem("drive_accounts"); if(d) accounts = JSON.parse(d); }
function formatGB(val){ return (typeof val === "number") ? val.toFixed(2) + " GB" : "0.00 GB"; }
function safeNum(v){ return (v == null) ? 0 : Number(v); }
function escapeHtml(s){ if(!s) return ""; return String(s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }

/* === init Google clients & bind handlers === */
function initApp(){
  // wait for libs to load
  if(typeof gapi === "undefined" || typeof google === "undefined"){
    setTimeout(initApp, 200);
    return;
  }

  gapi.load("client", async () => {
    await gapi.client.init({ apiKey: API_KEY });

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: handleTokenResponse
    });

    // bind controls
    document.getElementById("loginBtn").onclick = () => requestTokenInteractive();
    document.getElementById("exportBtn").onclick = exportAccounts;
    document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
    document.getElementById("importFile").onchange = handleImportFile;
    document.getElementById("refreshAllBtn").onclick = refreshAllTokensSilent;
    document.getElementById("clearAllBtn").onclick = () => {
      if(confirm(t("confirmClear"))){
        accounts = [];
        saveAccounts();
        renderAccounts();
      }
    };
    document.getElementById("sortSelect").onchange = renderAccounts;
    document.getElementById("filterInput").oninput = renderAccounts;

    // load & render
    loadAccounts();
    renderAccounts();
  });
}

/* === token flows === */

/* interactive request (add account) */
function requestTokenInteractive(){
  pendingEmailForToken = null;
  return new Promise((resolve) => {
    pendingTokenPromiseResolve = resolve;
    try {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } catch(err){
      console.error("requestAccessToken error", err);
      pendingEmailForToken = null;
      pendingTokenPromiseResolve = null;
      resolve(null);
    }
    // safety timeout
    setTimeout(()=>{
      if(pendingTokenPromiseResolve){ pendingTokenPromiseResolve(null); pendingTokenPromiseResolve = null; pendingEmailForToken = null; }
    }, 20000);
  });
}

/* request token for specific email (silent if asked) */
function requestTokenFor(email=null, silent=false){
  return new Promise((resolve) => {
    pendingEmailForToken = email || null;
    pendingTokenPromiseResolve = (respToken) => resolve(respToken);
    const opts = {};
    if(email) opts.hint = email;
    if(silent) opts.prompt = ''; // try silent
    try {
      tokenClient.requestAccessToken(opts);
    } catch(err){
      console.error("requestAccessToken error", err);
      pendingEmailForToken = null;
      pendingTokenPromiseResolve = null;
      resolve(null);
    }
    setTimeout(()=>{
      if(pendingTokenPromiseResolve){ pendingTokenPromiseResolve(null); pendingTokenPromiseResolve = null; pendingEmailForToken = null; }
    }, 15000);
  });
}

/* callback from google token client */
async function handleTokenResponse(resp){
  // resp may contain error
  if(!resp || resp.error){
    console.warn("Token response error or cancelled", resp);
    if(pendingTokenPromiseResolve) pendingTokenPromiseResolve(null);
    pendingTokenPromiseResolve = null;
    pendingEmailForToken = null;
    return;
  }

  const accessToken = resp.access_token || resp; // fallback

  try {
    // get user profile via OpenID Connect
    const ures = await fetch("https://openidconnect.googleapis.com/v1/userinfo", {
      headers: { Authorization: "Bearer " + accessToken }
    });
    const profile = await ures.json();

    const accEmail = profile.email || ("unknown-"+genId());
    const accName  = profile.name || accEmail;
    const accPic   = profile.picture || ("https://via.placeholder.com/80?text=?");

    const idx = accounts.findIndex(a => a.email === accEmail);
    if(idx >= 0){
      accounts[idx].token = accessToken;
      accounts[idx].needsToken = false;
      accounts[idx].name = accName;
      accounts[idx].picture = accPic;
      accounts[idx].lastFetched = Date.now();
    } else {
      const newAcc = {
        id: genId(),
        email: accEmail,
        name: accName,
        picture: accPic,
        token: accessToken,
        needsToken: false,
        lastFetched: Date.now()
      };
      accounts.push(newAcc);
    }

    saveAccounts();
    // fetch quota for this account
    await fetchQuotaForAccountByEmail(accEmail);
    renderAccounts();

    if(pendingTokenPromiseResolve){
      pendingTokenPromiseResolve(accessToken);
      pendingTokenPromiseResolve = null;
      pendingEmailForToken = null;
    }
  } catch(err){
    console.error("handleTokenResponse userinfo error", err);
    if(pendingTokenPromiseResolve){
      pendingTokenPromiseResolve(null);
      pendingTokenPromiseResolve = null;
      pendingEmailForToken = null;
    }
  }
}

/* === Export / Import === */
function exportAccounts(){
  const safe = accounts.map(a => ({ email: a.email, name: a.name, picture: a.picture, id: a.id }));
  const blob = new Blob([JSON.stringify(safe, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `drive_accounts_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  alert(t("alertExport"));
}

function handleImportFile(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const arr = JSON.parse(ev.target.result);
      if(!Array.isArray(arr)) throw new Error("File JSON cần chứa mảng các account");
      let imported = 0, updated = 0;
      arr.forEach(item => {
        if(!item.email) return;
        const idx = accounts.findIndex(a => a.email === item.email);
        if(idx >= 0){
          accounts[idx].name = item.name || accounts[idx].name;
          accounts[idx].picture = item.picture || accounts[idx].picture;
          accounts[idx].needsToken = true;
          accounts[idx].token = null;
          updated++;
        } else {
          accounts.push({
            id: item.id || genId(),
            email: item.email,
            name: item.name || item.email,
            picture: item.picture || "https://via.placeholder.com/80?text=?",
            token: null,
            needsToken: true,
            lastFetched: null
          });
          imported++;
        }
      });
      saveAccounts();
      renderAccounts();
      alert(t("alertImportResult", { newAcc: imported, updatedAcc: updated }));
    } catch(err){
      alert(t("errorImport") + err.message);
    }
  };
  reader.readAsText(f);
  // reset input
  e.target.value = "";
}

/* === fetch quota helpers === */
async function fetchQuotaForAccountByEmail(email){
  const idx = accounts.findIndex(a => a.email === email);
  if(idx < 0) return null;
  const acc = accounts[idx];
  if(!acc.token) return null;
  try {
    const res = await fetch("https://www.googleapis.com/drive/v3/about?fields=storageQuota", {
      headers: { Authorization: "Bearer " + acc.token }
    });
    const data = await res.json();
    if(data.error){
      console.warn("Drive API returned error:", data);
      // token expired -> try silent refresh once
      if(data.error && (data.error.code === 401 || (data.error.message && /Invalid Credentials/i.test(data.error.message)))){
        const newToken = await requestTokenFor(acc.email, true);
        if(newToken){
          accounts[idx].token = newToken;
          saveAccounts();
          return await fetchQuotaForAccountByEmail(email);
        } else {
          accounts[idx].needsToken = true;
          accounts[idx].token = null;
          saveAccounts();
          return null;
        }
      } else {
        return null;
      }
    } else if(data.storageQuota){
      accounts[idx].storageQuota = data.storageQuota;
      accounts[idx].lastFetched = Date.now();
      saveAccounts();
      return data.storageQuota;
    }
  } catch(err){
    console.error("fetchQuotaForAccountByEmail error", err);
    return null;
  }
}

/* fetch all quotas */
async function fetchAllQuotas(){
  for(const acc of accounts){
    if(!acc.token) continue;
    await fetchQuotaForAccountByEmail(acc.email);
  }
  renderAccounts();
}

/* Refresh all tokens silently */
async function refreshAllTokensSilent(){
  if(!accounts.length) { alert(t("noAccounts")); return; }
  if(!confirm(t("confirmRefreshAll"))) return;

  for(const acc of accounts){
    if(!acc.email) continue;
    try {
      const tkn = await requestTokenFor(acc.email, true);
      if(tkn){
        const i = accounts.findIndex(a => a.email === acc.email);
        if(i>=0){ accounts[i].token = tkn; accounts[i].needsToken = false; accounts[i].lastFetched = Date.now(); saveAccounts(); }
        await fetchQuotaForAccountByEmail(acc.email);
      }
    } catch(err){
      console.warn("refreshAllTokensSilent error for", acc.email, err);
    }
  }
  renderAccounts();
}

/* === render / UI (đã dùng t() cho mọi text) === */
async function renderAccounts(){
  const container = document.getElementById("driveAccounts");
  container.innerHTML = "";
  let totalAll = 0, usedAll = 0;

  // filter & sort
  const filter = (document.getElementById("filterInput") || {}).value?.toLowerCase() || "";
  const sortType = (document.getElementById("sortSelect") || {}).value || "default";
  // copy
  let list = accounts.slice();

  if(filter){
    list = list.filter(a => (a.email || "").toLowerCase().includes(filter) || (a.name || "").toLowerCase().includes(filter));
  }

  // derive numeric values
  list.forEach(a => {
    a._totalNum = a.storageQuota && a.storageQuota.limit ? Number(a.storageQuota.limit) / (1024*1024*1024) : 0;
    a._usedNum  = a.storageQuota && a.storageQuota.usage ? Number(a.storageQuota.usage) / (1024*1024*1024) : 0;
    a._remainNum = Math.max(0, a._totalNum - a._usedNum);
  });

  if(sortType === "used_desc"){ list.sort((x,y)=> (y._usedNum - x._usedNum)); }
  else if(sortType === "remain_desc"){ list.sort((x,y)=> (y._remainNum - x._remainNum)); }
  else if(sortType === "email_asc"){ list.sort((x,y)=> ( (x.email||"").localeCompare(y.email||"") )); }

  if(list.length === 0){
    container.innerHTML = `<p class="muted">${t("noAccounts")}</p>`;
    document.getElementById("summary").innerHTML = "";
    return;
  }

  for(const acc of list){
    const id = acc.id;
    const totalGB = acc.storageQuota && acc.storageQuota.limit ? Number(acc.storageQuota.limit) / (1024*1024*1024) : 0;
    const usedGB  = acc.storageQuota && acc.storageQuota.usage ? Number(acc.storageQuota.usage) / (1024*1024*1024) : 0;
    const usageInDrive = acc.storageQuota ? (acc.storageQuota.usageInDrive ? Number(acc.storageQuota.usageInDrive)/(1024*1024*1024) : null) : null;
    const usageInTrash = acc.storageQuota ? (acc.storageQuota.usageInDriveTrash ? Number(acc.storageQuota.usageInDriveTrash)/(1024*1024*1024) : null) : null;
    const remainGB = (totalGB > 0) ? (totalGB - usedGB) : 0;
    const percent = (totalGB > 0) ? (usedGB / totalGB * 100) : 0;

    totalAll += totalGB;
    usedAll  += usedGB;

    // container DOM
    const card = document.createElement("div");
    card.className = "account-card";
    card.id = "card-"+id;

    const left = document.createElement("div"); left.className = "left";
    const img = document.createElement("img"); img.src = acc.picture || "https://via.placeholder.com/80?text=?";
    left.appendChild(img);

    const main = document.createElement("div"); main.className = "main";

    // header
    const header = document.createElement("div");
    header.className = "card-header";
    header.innerHTML = `<div><strong>${escapeHtml(acc.name)}</strong> <span class="muted">(${escapeHtml(acc.email)})</span></div>`;

    // details
    const details = document.createElement("div");
    details.className = "details";
    details.innerHTML = `
      <div class="muted">${t("summaryTotal")}: ${ totalGB ? totalGB.toFixed(2)+" GB" : "Không xác định" } &nbsp; • &nbsp; ${t("summaryUsed")}: ${usedGB.toFixed(2)} GB &nbsp; • &nbsp; ${t("summaryRemain")}: ${remainGB.toFixed(2)} GB</div>
      ${ usageInDrive !== null ? `<div class="muted">Drive: ${usageInDrive.toFixed(2)} GB ${ usageInTrash !== null ? ` • Thùng rác: ${usageInTrash.toFixed(2)} GB` : "" }</div>` : "" }
      <div class="progress-bar" title="${ usedGB.toFixed(2) } GB / ${ totalGB ? totalGB.toFixed(2) + ' GB' : 'Không xác định' } (${ totalGB ? percent.toFixed(1) + '%' : '?' })">
        <div class="progress-fill" style="width:${ totalGB ? Math.min(100, percent) : 5 }%; ${percent>80 ? 'filter: hue-rotate(330deg) saturate(120%);' : ''}"></div>
      </div>
    `;

    // actions
    const actionRow = document.createElement("div"); actionRow.className = "actions";

    // Open Drive (use authuser param to hint browser)
    const openBtn = document.createElement("button"); openBtn.className = "btn";
    openBtn.textContent = t("openDrive");
    openBtn.onclick = () => {
      const url = `https://drive.google.com/drive/?authuser=${encodeURIComponent(acc.email)}`;
      window.open(url, "_blank");
    };
    actionRow.appendChild(openBtn);

    // Re-login / interactive token for specific account
    const reloginBtn = document.createElement("button"); reloginBtn.className = "btn";
    reloginBtn.textContent = acc.needsToken || !acc.token ? t("login") : t("refreshSilent");
    reloginBtn.onclick = async () => {
      reloginBtn.disabled = true;
      const origText = reloginBtn.textContent;
      reloginBtn.textContent = "Đang xử lý...";
      const token = await requestTokenFor(acc.email, false); // interactive
      if(token){
        const i = accounts.findIndex(a => a.email === acc.email);
        if(i>=0){ accounts[i].token = token; accounts[i].needsToken = false; saveAccounts(); }
        await fetchQuotaForAccountByEmail(acc.email);
        renderAccounts();
      } else {
        alert(currentLang === 'vi' ? "Không lấy được token (có thể user hủy). Thử lại." : "Could not obtain token (user may have cancelled). Try again.");
      }
      reloginBtn.disabled = false;
      reloginBtn.textContent = origText;
    };
    actionRow.appendChild(reloginBtn);

    // silent refresh for this account
    const silentBtn = document.createElement("button"); silentBtn.className = "btn";
    silentBtn.textContent = t("refreshSilent");
    silentBtn.onclick = async () => {
      silentBtn.disabled = true;
      const orig = silentBtn.textContent;
      silentBtn.textContent = "Đang làm mới...";
      const token = await requestTokenFor(acc.email, true);
      if(token){
        const ix = accounts.findIndex(a=>a.email===acc.email);
        if(ix>=0){ accounts[ix].token = token; accounts[ix].needsToken = false; saveAccounts(); await fetchQuotaForAccountByEmail(acc.email); renderAccounts(); }
        else alert(currentLang==='vi' ? "Không tìm thấy account sau khi refresh." : "Account not found after refresh.");
      } else {
        alert(currentLang==='vi' ? "Không thể silent-refresh (có thể chưa có session), hãy dùng Login tương tác." : "Silent refresh failed (no session). Use interactive Login.");
      }
      silentBtn.disabled = false;
      silentBtn.textContent = orig;
    };
    actionRow.appendChild(silentBtn);

    // delete
    const delBtn = document.createElement("button"); delBtn.className = "btn danger";
    delBtn.textContent = t("delete");
    delBtn.onclick = () => {
      if(confirm(t("confirmDelete", { email: acc.email }))){
        accounts = accounts.filter(a => a.id !== acc.id);
        saveAccounts();
        renderAccounts();
      }
    };
    actionRow.appendChild(delBtn);

    // collapse toggle
    const toggleBtn = document.createElement("button"); toggleBtn.className = "card-toggle";
    toggleBtn.innerHTML = t("collapse");
    toggleBtn.onclick = () => { card.classList.toggle("collapsed"); };
    actionRow.appendChild(toggleBtn);

    // show token / last fetched
    if(!acc.token || acc.needsToken){
      const warn = document.createElement("div"); warn.className = "muted";
      warn.textContent = t("tokenMissing");
      details.appendChild(warn);
    } else {
      const hint = document.createElement("div"); hint.className = "muted";
      hint.textContent = t("tokenAvailable", { time: acc.lastFetched ? new Date(acc.lastFetched).toLocaleString() : "?" });
      details.appendChild(hint);
    }

    main.appendChild(header);
    main.appendChild(details);
    main.appendChild(actionRow);

    card.appendChild(left);
    card.appendChild(main);
    container.appendChild(card);
  }

  // summary
  const remainAll = totalAll - usedAll;
  const percentAll = totalAll > 0 ? (usedAll / totalAll * 100) : 0;
  document.getElementById("summary").innerHTML = `
    <div class="summary-box">
      <h3>${t("totalSummary")}</h3>
      ${t("summaryTotal")}: ${ formatGB(totalAll) } &nbsp; • &nbsp; ${t("summaryUsed")}: ${ formatGB(usedAll) } &nbsp; • &nbsp; ${t("summaryRemain")}: ${ formatGB(remainAll) }
      <div class="progress-bar" title="${ formatGB(usedAll) } / ${ formatGB(totalAll) } (${ totalAll ? percentAll.toFixed(1) + '%' : '?' })">
        <div class="progress-fill" style="width:${ totalAll ? Math.min(100, percentAll) : 5 }%;"></div>
      </div>
    </div>
  `;
}

/* Periodic auto-update: fetch quotas for tokens older than 5 minutes */
setInterval(async () => {
  try {
    let needUpdate = false;
    const now = Date.now();
    for(const a of accounts){
      if(a.token && (!a.lastFetched || (now - a.lastFetched) > 1000*60*5)){
        needUpdate = true;
        await fetchQuotaForAccountByEmail(a.email);
      }
    }
    if(needUpdate) renderAccounts();
  } catch(e){ /* ignore */ }
}, 1000*60*3);

/* init */
initApp();

/* On load: try to fetch quotas for accounts that already have token */
window.addEventListener("load", async () => {
  // load accounts (again) and fetch quotas
  loadAccounts();
  for(const a of accounts){
    if(a.token) await fetchQuotaForAccountByEmail(a.email);
  }
  renderAccounts();
});
</script>
</body>
</html>
